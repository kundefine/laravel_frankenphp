services:
  app:
    build: .
    container_name: laravel-app
    restart: unless-stopped
    ports:
      - "80:8000"
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    volumes:
    - .:/app:delegated

  mysql:
    image: mysql:9.7.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8
    container_name: redis
    restart: unless-stopped

volumes:
  mysql_data: